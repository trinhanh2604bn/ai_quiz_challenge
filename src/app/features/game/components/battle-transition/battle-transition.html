<section class="pass" role="dialog" aria-labelledby="pass-title">
  <img class="mascot" src="game/home/mascot-point.png" alt="" />
  <div class="panel">
    <p class="eyebrow">Pass the device</p>
    <p class="mark" aria-hidden="true">VS</p>
    <h1 id="pass-title">{{ playerName() }}'s turn</h1>
    <p class="lead">
      Hand the device to {{ playerName() }}. The question stays hidden until the turn starts.
    </p>
    <button type="button" class="btn btn-primary continue" (click)="continued.emit()">
      Continue
    </button>
  </div>
</section>
