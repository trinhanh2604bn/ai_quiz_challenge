<fieldset class="selector">
  <legend>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M5 7.5h14M5 12h14M5 16.5h9"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </svg>
    Category
  </legend>
  <div class="choices">
    @for (item of categories; track item.id) {
      <button
        type="button"
        class="choice"
        [class.is-selected]="category() === item.id"
        [attr.aria-pressed]="category() === item.id"
        [attr.data-choice]="item.id"
        [attr.data-tone]="item.tone"
        (click)="categorySelected.emit(item.id)"
      >
        <span class="cat-icon" aria-hidden="true">
          @switch (item.tone) {
            @case ('fundamentals') {
              <svg viewBox="0 0 48 48">
                <rect x="8" y="10" width="32" height="26" rx="10" fill="#fff" />
                <rect x="12" y="14" width="24" height="14" rx="5" fill="#2e1065" />
                <circle cx="19" cy="21" r="2" fill="#f9a8d4" />
                <circle cx="29" cy="21" r="2" fill="#f9a8d4" />
                <path d="M20 25.5h8" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round" />
                <path d="M24 6v4M18 8.5l1.4 2.2M30 8.5l-1.4 2.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            }
            @case ('learning') {
              <svg viewBox="0 0 48 48">
                <path
                  d="M24 10c-5 1-9 5-9 10 0 2 .6 3.4.2 5.2-1.6 1-2.7 3-1.8 5.2 1.2 3 4.6 3.8 7.2 2.6 1.2 2.4 4.2 3.6 6.8 2.4 2.8 1.6 6.4-.2 7.2-3.4 1.4-1.6 1.6-4.6-.4-6.2.8-1.6 1.2-3.2.4-5.2-1.6-4.2-5.4-8.8-10.6-10.6z"
                  fill="#eff6ff"
                />
                <path
                  d="M24 14c-3.4.6-6.2 3.4-6.2 6.8 0 1.4.4 2.4.1 3.6M24 14c3.2.8 5.8 3.6 5.8 7"
                  fill="none"
                  stroke="#1d4ed8"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M18 28c1.6 1.4 3.2 1.6 4.8.2M25 27.5c1.4 1.6 3.2 1.8 4.8.2"
                  fill="none"
                  stroke="#2563eb"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <circle cx="20" cy="22" r="1.6" fill="#1d4ed8" />
                <circle cx="28" cy="23" r="1.6" fill="#1d4ed8" />
              </svg>
            }
            @case ('deep') {
              <svg viewBox="0 0 48 48">
                <path d="M14 30 24 16l10 14" fill="none" stroke="#ddd6fe" stroke-width="2" />
                <path d="M16 22h16M14 30h20" fill="none" stroke="#ddd6fe" stroke-width="2" />
                <circle cx="24" cy="15" r="4" fill="#fff" />
                <circle cx="14" cy="30" r="4" fill="#c4b5fd" />
                <circle cx="34" cy="30" r="4" fill="#a78bfa" />
                <circle cx="24" cy="36" r="3.2" fill="#818cf8" />
                <circle cx="24" cy="15" r="1.6" fill="#6d28d9" />
              </svg>
            }
            @case ('generative') {
              <svg viewBox="0 0 48 48">
                <path
                  d="M24 12c6 0 12 4 12 10 0 7-6 12-12 12H16c-2 0-4-2-4-4v-4c0-8 5-14 12-14z"
                  fill="#fff"
                />
                <circle cx="18" cy="20" r="2.2" fill="#fb7185" />
                <circle cx="25" cy="17" r="2.2" fill="#fbbf24" />
                <circle cx="30" cy="22" r="2.2" fill="#38bdf8" />
                <circle cx="22" cy="25" r="2.2" fill="#a78bfa" />
                <path d="M16 34h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
              </svg>
            }
            @case ('prompt') {
              <svg viewBox="0 0 48 48">
                <rect x="10" y="12" width="20" height="24" rx="4" fill="#fff" />
                <path d="M15 19h10M15 24h8M15 29h6" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" />
                <path d="M28 22l8-8 4 4-8 8-5 1z" fill="#fde68a" stroke="#b45309" stroke-width="1.4" />
              </svg>
            }
          }
        </span>
        <span class="cat-copy">
          <span class="cat-name">{{ item.id }}</span>
          <span class="cat-blurb">{{ item.blurb }}</span>
        </span>
        @if (category() === item.id) {
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 16 16">
              <path
                d="M3.5 8.2 6.4 11l6.1-6"
                fill="none"
                stroke="#fff"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        }
      </button>
    }
  </div>
</fieldset>

<fieldset class="selector">
  <legend>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="m12 3 2.1 5.4L20 9.2l-4.2 3.6L17 18l-5-2.8L7 18l1.2-5.2L4 9.2l5.9-.8z"
        fill="currentColor"
      />
    </svg>
    Difficulty
  </legend>
  <div class="choices diffs">
    @for (item of difficulties; track item) {
      <button
        type="button"
        class="choice diff"
        [class.is-selected]="difficulty() === item"
        [attr.aria-pressed]="difficulty() === item"
        [attr.data-choice]="item"
        (click)="difficultySelected.emit(item)"
      >
        <span class="diff-badge" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path
              d="m16 4 3.1 7.2L27 12.2l-5.6 4.8 1.7 7.6L16 20.8 8.9 24.6l1.7-7.6L5 12.2l7.9-1z"
              fill="#fff"
            />
          </svg>
        </span>
        <span class="diff-name">{{ item }}</span>
        <span class="diff-blurb">{{ difficultyCopy[item] }}</span>
        @if (difficulty() === item) {
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 16 16">
              <path
                d="M3.5 8.2 6.4 11l6.1-6"
                fill="none"
                stroke="#fff"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        }
      </button>
    }
  </div>
</fieldset>
