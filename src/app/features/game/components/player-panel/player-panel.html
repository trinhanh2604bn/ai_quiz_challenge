<article class="player" [class.is-active]="active()" [attr.data-tone]="tone()">
  <div class="identity">
    <span class="avatar" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect x="6" y="9" width="20" height="15" rx="7" fill="#fff" />
        <circle cx="13" cy="16" r="1.6" />
        <circle cx="19" cy="16" r="1.6" />
        <path d="M13 20h6" fill="none" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </span>
    <div class="who">
      <p class="turn">{{ active() ? 'Active turn' : 'Waiting' }}</p>
      <h2>{{ name() }}</h2>
    </div>
  </div>
  <dl>
    <div class="score-stat">
      <dt>Score</dt>
      <dd>{{ score() }}</dd>
      <app-score-popup [score]="score()" />
    </div>
    <div class="streak" [class.hot]="streak() >= 3">
      <dt>Streak</dt>
      <dd>{{ streak() }}</dd>
    </div>
  </dl>
</article>
