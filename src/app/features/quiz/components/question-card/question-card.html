<article class="prompt">
  <div class="chips">
    <p class="chip">{{ question().category }}</p>
    <p class="chip" [attr.data-level]="question().difficulty">{{ question().difficulty }}</p>
    <p class="badge">{{ badge() || question().category }}</p>
  </div>
  <h2>{{ question().text }}</h2>
  <div class="options" role="group" aria-label="Answer options">
    @for (option of question().options; track $index) {
      <button
        type="button"
        class="option answer-card"
        [class.correct]="optionState($index) === 'correct'"
        [class.incorrect]="optionState($index) === 'incorrect'"
        [class.reveal]="optionState($index) === 'reveal'"
        [disabled]="isLocked()"
        (click)="selectOption($index)"
      >
        <span class="letter" aria-hidden="true">{{ optionLabel($index) }}</span>
        <span class="text">{{ option }}</span>
        <span class="indicator" aria-hidden="true"></span>
      </button>
    }
  </div>
</article>
