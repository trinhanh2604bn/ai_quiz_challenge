<app-game-background>
  <section class="arena">
    <app-game-hud
      playerName="You"
      [score]="score()"
      [correctCount]="correctCount()"
      [streak]="streak()"
      [multiplier]="multiplier()"
      [progress]="progress()"
      [questionLabel]="questionLabel()"
      [detail]="sessionDetail()"
    />

    @for (question of visibleQuestions(); track question.id) {
      <div class="round">
        <div class="round-head">
          <app-timer (timedOut)="onTimeout(question.id)" />
        </div>
        <app-question-card
          [question]="question"
          [badge]="questionLabel()"
          [selectedIndex]="selectedOption()"
          (answerSelected)="onAnswerSelected($event)"
        />
      </div>
    }

    @if (showEmptySelection()) {
      <app-game-card>
        <div class="empty-state">
          <p>No questions available for this selection.</p>
          <a class="btn btn-secondary" routerLink="/">Choose again</a>
        </div>
      </app-game-card>
    }
  </section>
</app-game-background>
