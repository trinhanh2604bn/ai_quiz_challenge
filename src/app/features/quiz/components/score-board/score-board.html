<section aria-label="Current score">
  <dl class="stat-grid">
    <div>
      <dt>Score</dt>
      <dd>{{ score() }}</dd>
    </div>
    <div>
      <dt>Correct</dt>
      <dd>{{ correctCount() }}</dd>
    </div>
    <div [class.hot]="streak() >= 3">
      <dt>Streak</dt>
      <dd>{{ streak() }}</dd>
    </div>
    <div [class.hot]="multiplier() > 1">
      <dt>Multiplier</dt>
      <dd>{{ multiplier() }}x</dd>
    </div>
  </dl>
</section>
